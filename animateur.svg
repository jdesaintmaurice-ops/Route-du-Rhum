<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" width="360" height="500">
  <title>Nikos, le présentateur</title>
  <defs>
    <linearGradient id="peau" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d3ae"/><stop offset="1" stop-color="#e5b387"/></linearGradient>
    <linearGradient id="cheveux" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3e5ea"/><stop offset="1" stop-color="#9a9fab"/></linearGradient>
    <linearGradient id="satin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#283a7e"/><stop offset="1" stop-color="#0d1538"/></linearGradient>
    <linearGradient id="argent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef0f4"/><stop offset="1" stop-color="#8d939f"/></linearGradient>
    <pattern id="rayures" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#1b2a5c"/><rect x="0" width="1.6" height="9" fill="#33458a"/></pattern>
    <pattern id="grille" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#9aa0ab"/><circle cx="2.5" cy="2.5" r="1.1" fill="#4b505b"/></pattern>
    <clipPath id="veste"><path d="M92 200 Q96 168 140 160 L220 160 Q264 168 268 200 L284 352 Q180 376 76 352 Z"/></clipPath>
  </defs>
  <style>
    .tout { animation: flotte 1.4s ease-in-out infinite alternate; }
    @keyframes flotte { from { transform: translateY(0); } to { transform: translateY(-3px); } }
    .buste { transform-box: fill-box; transform-origin: 50% 100%; animation: respire 2.2s ease-in-out infinite alternate; }
    @keyframes respire { from { transform: scale(1, 1); } to { transform: scale(1.012, 1.018); } }
    .tete { transform-box: fill-box; transform-origin: 50% 100%; animation: hoche 1.8s ease-in-out infinite alternate; }
    @keyframes hoche { from { transform: rotate(-2deg); } to { transform: rotate(2.5deg); } }
    .paupiere { transform-box: fill-box; transform-origin: 50% 0%; animation: cligne 4.5s infinite; }
    @keyframes cligne { 0%, 92%, 100% { transform: scaleY(0); } 95.5% { transform: scaleY(1); } }
    .bouche { transform-box: fill-box; transform-origin: 50% 0%; animation: parle .55s ease-in-out infinite alternate; }
    @keyframes parle { from { transform: scaleY(.55); } to { transform: scaleY(1.05); } }
    .avant-bras { transform-box: view-box; transform-origin: 52px 232px; animation: salue .75s ease-in-out infinite alternate; }
    @keyframes salue { from { transform: rotate(-14deg); } to { transform: rotate(16deg); } }
    .bras-micro { transform-box: view-box; transform-origin: 258px 198px; animation: micro 1.6s ease-in-out infinite alternate; }
    @keyframes micro { from { transform: rotate(-2deg); } to { transform: rotate(3deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <ellipse cx="180" cy="480" rx="104" ry="12" fill="rgba(0,0,0,.32)"/>
  <g class="tout">
    <!-- jambes et chaussures -->
    <path d="M136 344 L130 466 L174 466 L179 344 Z" fill="#141b3d"/>
    <path d="M181 344 L186 466 L230 466 L224 344 Z" fill="#141b3d"/>
    <path d="M122 466 Q119 484 138 484 L178 484 Q183 472 174 466 Z" fill="#0a0b11"/>
    <path d="M238 466 Q241 484 222 484 L182 484 Q177 472 186 466 Z" fill="#0a0b11"/>
    <path d="M130 472 Q146 470 166 474" stroke="#3c4152" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M230 472 Q214 470 194 474" stroke="#3c4152" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <g class="buste">
      <!-- veste rayée -->
      <path d="M92 200 Q96 168 140 160 L220 160 Q264 168 268 200 L284 352 Q180 376 76 352 Z" fill="url(#rayures)"/>
      <g clip-path="url(#veste)"><path d="M92 200 Q96 168 140 160 L220 160 Q264 168 268 200 L284 352 Q180 376 76 352 Z" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="10"/></g>
      <!-- chemise ouverte -->
      <path d="M144 160 L180 270 L216 160 Z" fill="#f7f7f5"/>
      <path d="M180 270 L180 176" stroke="#d9dadf" stroke-width="1.5"/>
      <!-- cou -->
      <path d="M156 126 L156 166 Q180 184 204 166 L204 126 Z" fill="#e7b78c"/>
      <path d="M156 150 Q180 170 204 150 L204 166 Q180 184 156 166 Z" fill="rgba(120,70,40,.18)"/>
      <!-- cols de chemise -->
      <path d="M144 160 L164 150 L174 184 L158 196 Z" fill="#ffffff" stroke="#d2d3d8" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M216 160 L196 150 L186 184 L202 196 Z" fill="#ffffff" stroke="#d2d3d8" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- revers satinés -->
      <path d="M144 160 L180 272 L152 306 L110 218 L132 170 Z" fill="url(#satin)" stroke="#4a5cab" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M216 160 L180 272 L208 306 L250 218 L228 170 Z" fill="url(#satin)" stroke="#4a5cab" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="180" cy="304" r="4.5" fill="#0a0f2b"/>
      <!-- pochette -->
      <path d="M118 262 L146 258 L144 274 L120 276 Z" fill="#f7f7f5" stroke="#d2d3d8"/>
    </g>

    <!-- bras gauche (celui qui salue) -->
    <path d="M104 198 L52 232" stroke="#1b2a5c" stroke-width="36" stroke-linecap="round" fill="none"/>
    <path d="M104 198 L52 232" stroke="url(#rayures)" stroke-width="30" stroke-linecap="round" fill="none"/>
    <g class="avant-bras">
      <path d="M52 232 L40 176" stroke="#1b2a5c" stroke-width="32" stroke-linecap="round" fill="none"/>
      <rect x="27" y="170" width="28" height="9" rx="3" fill="#ffffff" transform="rotate(-12 41 174)"/>
      <ellipse cx="37" cy="156" rx="16" ry="19" fill="url(#peau)"/>
      <g fill="url(#peau)" stroke="#d9a479" stroke-width=".8">
        <rect x="19" y="127" width="8" height="22" rx="4" transform="rotate(-18 23 148)"/>
        <rect x="29" y="122" width="8" height="25" rx="4" transform="rotate(-4 33 146)"/>
        <rect x="39" y="122" width="8" height="25" rx="4" transform="rotate(8 43 146)"/>
        <rect x="48" y="127" width="8" height="22" rx="4" transform="rotate(20 52 148)"/>
        <rect x="52" y="150" width="8" height="18" rx="4" transform="rotate(62 56 158)"/>
      </g>
    </g>

    <!-- bras droit (micro) -->
    <g class="bras-micro">
      <path d="M258 198 L292 270 L238 222" stroke="#1b2a5c" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M258 198 L292 270 L238 222" stroke="url(#rayures)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="226" y="214" width="26" height="10" rx="3" fill="#ffffff" transform="rotate(38 239 219)"/>
      <circle cx="246" cy="228" r="9" fill="url(#argent)" stroke="#6f7480" stroke-width="1.5"/>
      <circle cx="246" cy="228" r="5.5" fill="#2c4f9e"/>
      <rect x="220" y="140" width="16" height="64" rx="8" fill="#14151a"/>
      <rect x="220" y="150" width="16" height="5" fill="#9aa0ab"/>
      <circle cx="228" cy="132" r="17" fill="url(#grille)" stroke="#6b717d" stroke-width="2"/>
      <ellipse cx="228" cy="200" rx="15" ry="12" fill="url(#peau)"/>
      <g fill="url(#peau)" stroke="#d9a479" stroke-width=".8">
        <rect x="212" y="186" width="30" height="8" rx="4"/><rect x="213" y="195" width="30" height="8" rx="4"/><rect x="214" y="204" width="28" height="8" rx="4"/>
      </g>
    </g>

    <!-- tête -->
    <g class="tete">
      <ellipse cx="128" cy="100" rx="9" ry="14" fill="#e6b488"/>
      <ellipse cx="232" cy="100" rx="9" ry="14" fill="#e6b488"/>
      <ellipse cx="180" cy="94" rx="52" ry="60" fill="url(#peau)"/>
      <!-- cheveux argentés -->
      <path d="M126 92 C118 40 152 14 190 18 C228 20 246 48 234 92 C230 68 216 52 192 50 C164 48 140 62 126 92 Z" fill="url(#cheveux)"/>
      <path d="M126 92 L128 114 L136 98 Z" fill="#a4a8b3"/><path d="M234 92 L232 114 L224 98 Z" fill="#a4a8b3"/>
      <path d="M150 40 Q176 28 206 36 M158 50 Q182 40 214 48" stroke="#f4f5f8" stroke-width="3" stroke-linecap="round" fill="none" opacity=".8"/>
      <!-- visage -->
      <path d="M144 76 Q158 66 174 73 M186 73 Q202 66 216 76" stroke="#555a66" stroke-width="5.5" stroke-linecap="round" fill="none"/>
      <ellipse cx="159" cy="90" rx="11" ry="8" fill="#ffffff"/><ellipse cx="201" cy="90" rx="11" ry="8" fill="#ffffff"/>
      <circle cx="160.5" cy="90" r="5.5" fill="#5b3a22"/><circle cx="202.5" cy="90" r="5.5" fill="#5b3a22"/>
      <circle cx="160.5" cy="90" r="2.6" fill="#120c08"/><circle cx="202.5" cy="90" r="2.6" fill="#120c08"/>
      <circle cx="162.5" cy="88" r="1.5" fill="#fff"/><circle cx="204.5" cy="88" r="1.5" fill="#fff"/>
      <ellipse class="paupiere" cx="159" cy="89" rx="12" ry="9" fill="#efc59e"/><ellipse class="paupiere" cx="201" cy="89" rx="12" ry="9" fill="#efc59e"/>
      <path d="M180 92 Q172 112 180 116 Q188 116 186 111" stroke="#c48b62" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="144" cy="112" r="10" fill="#ee8c78" opacity=".28"/><circle cx="216" cy="112" r="10" fill="#ee8c78" opacity=".28"/>
      <g class="bouche"><path d="M156 122 Q180 152 204 122 Z" fill="#7b2432"/><path d="M160 123 Q180 132 200 123 L198 127 Q180 136 162 127 Z" fill="#ffffff"/></g>
      <path d="M154 118 Q150 124 154 130 M206 118 Q210 124 206 130" stroke="#c48b62" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>
    </g>
  </g>
</svg>
